  {id:"tongzhi", gen:1, name:"通直公", l1:"始祖", l2:"宋・莆田縣令", parent:"", direct:true,

  {id:"zhenzhi", gen:3, name:"震之公", l1:"三世祖", l2:"", parent:"erfeng2", direct:true,

  {id:"zhishang", gen:4, name:"知尚公", l1:"四世祖", l2:"", parent:"zhenzhi", direct:true,

  {id:"mengzhi", gen:5, name:"五父公", l1:"五世祖", l2:"", parent:"zhishang", direct:true,

  {id:"youshan", gen:6, name:"后山公", l1:"六世祖", l2:"", parent:"mengzhi", direct:true,

  {id:"yinzhai", gen:7, name:"隱斋公", l1:"長房", l2:"", parent:"youshan", direct:true,

  {id:"xiangxuan", gen:7, name:"祥斋公", l1:"二房", l2:"早亡", parent:"youshan",

  {id:"chengzhai", gen:7, name:"成斋公", l1:"三房", l2:"早亡", parent:"youshan",

  {id:"zhongzhai", gen:7, name:"中斋公", l1:"四房", l2:"", parent:"youshan",

  {id:"liangzhai", gen:7, name:"良斋公", l1:"五房", l2:"", parent:"youshan",

  {id:"guifeng", gen:8, name:"桂峯公", l1:"八世開枝", l2:"", parent:"yinzhai", direct:true,
   note:"隱斋公之子。名元愷，字維勛，號桂峯。八世開枝，生三房頭。十一月十一日忌。\n大媽孺人郭氏：生長房；二月初三日忌；葬飛鵝嶺。\n二媽孺人洪氏：生三房；正月初十日忌；與桂峯公合葬蜈蚣嶺。\n三媽側室懿恭李氏：生二房；二月十九日忌；葬蔡口赤肚嶺。\n族親補充：桂峯公三子是現在華美鄉全部人口的始祖。三個房頭的人口歷來相差不大，到現在還是如此。各房都有人過洋。", src:"第一頁 第6–8行；世系第二圖；世系詳註第二頁"},

  {id:"songxuan", gen:9, name:"松軒公", l1:"二房", l2:"", parent:"guifeng",
   note:"桂峯公二房，號松軒。母側室李氏。\n序文記：松軒公一派有遷居金甌[?]鄉，已改新輩序。在馬來亞，二房松軒祖派均已為僑生，多住爪夷（Jawi，在檳城州）。\n族親補充：到泰國（暹羅）的族人，多是二房松軒公派下。", src:"第一頁 第8行；世系第二圖；世系詳註第二頁；序文第三頁"},
  {id:"meipu", gen:9, name:"梅圃公", l1:"三房", l2:"", parent:"guifeng", direct:true,
   note:"桂峯公三房，母洪氏。名允斋，字仕勉，號梅圃。九世祖，生三子。妣端慎鄭氏媽。考六月初三日忌，妣七月廿八日忌（待核）。考妣合葬蜈蚣嶺。\n序文記：在馬來亞，梅圃祖派孫頗多（此句只指馬來亞）。梅圃公是三房始祖。", src:"第一頁 第8–11行；世系第二圖；世系詳註第二頁；序文第三頁"},
  {id:"chengjiang", gen:10, name:"澄江公", l1:"三房長", l2:"派孫稀微", parent:"meipu",

  {id:"qingyin", gen:10, name:"清隱公", l1:"三房二", l2:"處士義民", parent:"meipu", direct:true,
   note:"梅圃公二房，俗稱三房二。十世祖。處士義民、明誥封太君、義官職事郎。名錫真，字胤永，號清隱。生四子。妣孺人純慈郭氏媽。考九月十五日忌，妣十月初十日忌。考妣合葬浮山童子拜觀音。", src:"第一頁 第12、15–16行；世系第二圖；世系詳註第三頁"},
  {id:"pingyuan", gen:10, name:"平原公", l1:"三房三", l2:"派孫稀微", parent:"meipu",
   note:"梅圃公三房，俗稱三房三。派孫歷代稀微。", src:"第一頁 第13–14行；世系第二圖"},
  {id:"tianshou", gen:11, name:"恬守公", l1:"長房", l2:"", parent:"qingyin", direct:true,
   note:"清隱公長房。名寯，字德章，號恬守。十一世祖，誥贈太封君。生八子。妣太夫人貞節范氏媽。考六月初一日忌，妣七月十四日忌。考妣合葬大埔寮狗肚山。", src:"第一頁 第16、22行；世系第三圖；世系詳註第三頁"},
  {id:"dongyuan", gen:11, name:"東園公", l1:"二房", l2:"明代遷海豐", parent:"qingyin",
   note:"清隱公二房。名寧，字德雍，號東園，又號嚴鎮；廩生，敕封給事中。生一子東石公。明代遷居廣東惠州府海豐縣楓林鄉、前港鄉、後港鄉創祖。", src:"第一頁 第16–21行；世系第三圖；世系詳註第三頁"},
  {id:"jingsu", gen:11, name:"靖素公", l1:"三房", l2:"明代遷海豐", parent:"qingyin",

  {id:"degong", gen:11, name:"德恭公", l1:"四房", l2:"明代遷海豐", parent:"qingyin",

  {id:"dongshi", gen:12, name:"東石公", l1:"進士", l2:"俗稱陳北科", parent:"dongyuan",

  {id:"peimian", gen:12, name:"侃勉公", l1:"七房", l2:"名汪・字世大", parent:"tianshou",

  {id:"jibin", gen:12, name:"善巽公", l1:"八房", l2:"名澤・后溝派", parent:"tianshou",

  {id:"yangquan", gen:14, name:"養泉公", l1:"三房", l2:"平和縣縣令", parent:"dongqu", direct:true,
   note:"東渠公三房。號養泉。十四世祖，鄉進士、文林郎，任平和縣知縣。生十子。八月初一日忌；葬香圓坑，與王氏媽合穴。\n大媽太孺人端淑鄭氏：十月十八日忌；單葬神山東渠祖邊。\n二媽太孺人端懿王氏：生五子（一至五房）；九月初三日忌。\n三媽太孺人真慈曾氏：生二子（七、八房）；十二月廿一日忌。\n四媽太孺人貞肅黃氏：生一子（六房）；七月十九日忌。曾、黃二位合葬烏鴉落洋。\n李氏婆：生二子（九、十房）。", src:"第二頁 第4–6行；世系第三圖；世系詳註第四頁"},

  {id:"ziying", gen:24, name:"子英公", l1:"二房", l2:"1853–1905・字光達", parent:"pingzhang",
   note:"平章公二房。名文知，書名德尊，字光達，號子英公。生於咸豐三年癸丑七月初六日寅時（原文作公元一八五二年；咸豐三年應為一八五三年）。終於光緒三十一年乙巳二月廿日未時，即一九〇五年三月廿五日（星期六）。享壽五十三。葬在倒地木（末字待核）。生四子一女。\n妣鄭氏媽：名寵（待核），號仁賢。生於咸豐七年丁巳正月初八日子時（原文作一八五六年；應為一八五七年）。終於民國五年丙辰正月初四日，即一九一六年二月六日（星期日）。享壽六十。葬在浮山六峰祖左畔。娘家在貴嶼寨內寨腳鄭宅。", src:"第三頁 第13行；世系第五圖；平章祖第二子詳註（接九頁一）"},
  {id:"ziting", gen:24, name:"子庭公", l1:"三房", l2:"1856–1922・字光茂", parent:"pingzhang",
   note:"平章公三房。名文快，書名德暢，字光茂，號子庭公。生於咸豐六年丙辰正月廿二日寅時（原文作公元一八五五年；應為一八五六年）。終於民國十一年壬戌七月初二日午時，即一九二二年八月廿四日（星期四）。享壽六十七。葬在龍门橫山頂。生三子二女。\n妣李氏媽：名亞香，號仁良。生於咸豐十一年辛酉十二月十三日申時（原文作一八六〇年；應為西曆一八六二年一月）。終於光緒廿九年癸卯八月十七日未時，即一九〇三年十月七日（星期三）。享壽四十三。葬在龍门橫山頂。娘家在貴嶼北门李宅。長女適南陽山普鄉，次女適南陽東洋鄉。", src:"第三頁 第13行；世系第五圖；子庭祖派下詳註（接九頁一）"},
  {id:"ziyun", gen:24, name:"子雲公", l1:"四房", l2:"字光祥", parent:"pingzhang",
   note:"平章公四房，號子雲公，太學生。名文扶（第二字待核），書名德佳，字（族）光祥。生於咸豐八年戊午十月十八日寅時（一八五八年）。終於民國三十六年丁亥十二月十八日，即一九四八年一月廿八日（星期三）。享壽原文作八十九（虛歲應為九十）。葬龍门橫山頂。\n元配郭氏：號仁榮。生於同治六年（原文公元作一八六六年；同治六年應為一八六七年）九月十九日亥時。終於光緒廿七年辛丑正月二十日酉時，即一九〇一年三月十日（星期日）。享壽原文作三十。娘家南陽鄉。生二子一女，女適南陽鄉。\n繼室蘇氏：號仁壽。生於同治九年庚午四月廿七日申時（原文公元作一八六九年；應為一八七〇年）。終於民國四十二年癸巳三月十七日，即一九五三年四月三十日（星期四），享壽八十四。葬本鄉後山頂。娘家碧士（待核）蘇。生一男一女，女名冰心，適青洋山蘇。\n孝猛生於郭氏去世後，應為蘇氏所生（推算）。生三子：孝儀、孝順、孝猛。", src:"第三頁 第13–14行；世系第五圖；子雲祖派下詳註（接九頁一至五）"},
  {id:"zibin", gen:24, name:"子彬公", l1:"五房", l2:"1861–1919・字光儀", parent:"pingzhang",
   note:"平章公五房。名文德，書名德修，字光儀，號子彬公。生於咸豐十一年辛酉八月十七日午時（原文作公元一八六〇年；咸豐十一年應為一八六一年）。終於民國八年己未閏七月初七日丑時，即一九一九年八月卅一日（星期日）。享壽五十九。葬高南橫山（待核）。生二子一女。\n妣廖氏媽：名原文空白，號仁豐。生於同治十二年癸酉七月初十日子時（原文作一八七二年；同治十二年應為一八七三年）。終於光緒二十七年辛丑元月廿二日酉時，即一九〇一年三月十二日（星期二）。享壽二十九。葬浮山。生二男一女。", src:"第三頁 第14行；世系第五圖；世系第七圖；子彬祖派下詳註（接九頁一）"},

  {id:"ruohao_1", gen:25, name:"朝宗", l1:"長房・號義忠", l2:"1873–1939・葬本里", parent:"ruohao",
   note:"若豪公長房。名朝宗，書名開仁，字世△，號義忠公。生於同治十二年癸酉九月△日丑時（原文作公元一八七二年；同治十二年應為一八七三年）。終於民國廿八年己卯三月十四日丑時，即一九三九年五月三日（星期三）。享壽六十六。廿餘歲來南洋，住檳城四十餘年，一生獨身，晚年回鄉。葬在本里後山鑼鼓石腳，碑號「義忠陳公墓」。", src:"世系第五圖；世系第六圖；若豪祖派下詳註（接九頁二）"},
  {id:"ruohao_2", gen:25, name:"朝陽", l1:"二房・號義鳴", l2:"1875–1929・葬檳城", parent:"ruohao",
   note:"若豪公二房。名朝陽，書名開儀，字世鳳，號義鳴公。生於光緒元年乙亥六月△日辰時（原文作公元一八七四年；光緒元年應為一八七五年）。終於民國十八年己巳四月初三日丑時，即一九二九年五月十一日（星期六），在檳城去世。享壽五十五。葬在檳城廣東公塚上山大路邊左畔第三穴，碑號「朝陽陳公」。\n妣張氏媽：名秋妹，號慈孝。生於光緒十九年癸巳十月初二日卯時，即一八九三年十一月九日（星期四）。娘家在普寧洋梅仔鄉。\n生二子。", src:"世系第五圖；世系第六圖；若豪祖派下詳註（接九頁三）"},

  {id:"ziying_1", gen:25, name:"仕任", l1:"長房", l2:"1878–1899・早亡", parent:"ziying",

  {id:"ziying_2", gen:25, name:"仕堅", l1:"二房・字世剛", l2:"1884生・書名開強", parent:"ziying",
   note:"子英公二房。名仕堅，字世剛，書名開強，號原文空白。生於光緒十年甲申九月十七日，即一八八四年十一月四日（星期二）。卒年原文空白。生三子一女。\n妣郭氏媽：名娘根，號慈勤。生於光緒十一年乙酉十月初五日，即一八八五年十一月十一日（星期三）。終於民國三十二年癸未六月初六日，即一九四三年七月七日（星期三）。享壽五十九。葬在本里後山十八層。娘家在南陽鄉。", src:"世系第五圖；世系圖（平章祖第二子派孫）；平章祖第二子詳註（接九頁一）；子英祖派下詳註（接九頁二）"},
  {id:"ziying_3", gen:25, name:"仕釵", l1:"三房", l2:"1887–1906・葬暹羅", parent:"ziying",
   note:"子英公三房。名仕釵（第五圖讀作「仕敘」），書名開拔。生於光緒十三年丁亥三月十七日，即一八八七年四月九日（星期六；原文年份先寫一八八五，後改）。終於光緒三十二年丙午六月廿六日，即一九〇六年八月十五日（星期三）。享壽二十。葬暹羅。", src:"世系第五圖；世系圖（平章祖第二子派孫）；平章祖第二子詳註（接九頁一）；子英祖派下詳註（接九頁二）"},
  {id:"ziying_4", gen:25, name:"朝圓", l1:"四房", l2:"1893–1925・葬檳城", parent:"ziying",
   note:"子英公四房。名朝圓（第五圖讀作「朝圖」），書名開容。生於光緒十九年癸巳九月初一日，即一八九三年十月十日（星期二）。終於民國十四年乙丑正月初一日，即一九二五年一月廿四日（星期六；原文日期有塗改）。享壽三十二（虛歲應為三十三）。葬在檳城廣東公塚。", src:"世系第五圖；世系圖（平章祖第二子派孫）；平章祖第二子詳註（接九頁一）；子英祖派下詳註（接九頁二）"},

  {id:"ziting_1", gen:25, name:"亞鑑", l1:"長房・號利東", l2:"1885–1934・字世衡", parent:"ziting",
   note:"子庭公長房。名亞鑑，字世衡，號利東，書名開明。生於光緒十一年乙酉正月初四日寅時，即一八八五年二月十八日（星期三）。終於民國廿三年甲戌七月廿一日辰時，即一九三四年八月三十日（星期四）。享壽五十。葬在南徑浮山。生四子四女。\n妣郭氏媽：名欉，號勤添（待核）。生於光緒十五年己丑八月廿五日酉時，即一八八九年九月十九日（星期四）。卒年原文空白。娘家在南陽鄉。", src:"世系第五圖；世系圖（平章祖第三子派孫）；子庭祖派下詳註（接九頁二）"},
  {id:"ziting_2", gen:25, name:"錦有", l1:"二房", l2:"字世吉", parent:"ziting",
   note:"子庭公二房。名錦有，字世吉，書名開大，號原文空白。生卒原文空白。原文列六房，填四子。\n妣莊氏：名秀宝。生卒原文空白。娘家在貴嶼後望鄉新厝。", src:"世系第五圖；世系圖（平章祖第三子派孫）；子庭祖派下詳註（接九頁五）"},
  {id:"ziting_3", gen:25, name:"錦益", l1:"三房", l2:"1900–1950・葬吡叻爪夷", parent:"ziting",
   note:"子庭公三房。名錦益，字世光，書名開謙。生於光緒廿六年庚子十月十七日寅時，即一九〇〇年十二月八日（星期六；原文年份作一八九九）。終於民國三十九年庚寅六月初三日，即一九五〇年七月十七日（星期一）。享壽五十一。葬在吡叻爪夷山華僑公塚。（待考：爪夷即 Jawi，在檳城州，與原文「吡叻」不合。）生一男二女。\n妣郭氏：名美花。生於光緒廿九年癸卯九月初八日卯時，即一九〇三年十月廿七日（星期二）。卒年原文空白。娘家在南陽坑仔新鄉。", src:"世系第五圖；世系圖（平章祖第三子派孫）；子庭祖派下詳註（接九頁七）"},
  {id:"ziyun_1", gen:25, name:"孝儀", l1:"長房・號伯容", l2:"1887–1949・書名開傳", parent:"ziyun",
   note:"子雲公長房。名孝儀，書名開傳，字世相，號伯容。生於光緒十三年丁亥七月初一日，即一八八七年八月十九日（星期五）。終於民國三十八年己丑六月十二日，即一九四九年七月七日（星期四），享壽六十三。葬本里後山頂。\n聘郭氏呀娘：號巖美。生於光緒十七年辛卯十月廿五日子時，即一八九一年十一月廿六日（星期四）。未結婚已夭亡。\n妻郭氏欉：號巖音。生於光緒十七年辛卯十二月初九日未時，即一八九二年一月八日（星期五）。娘家南陽鄉。\n生三子四女。", src:"世系第五圖；世系圖（平章祖第四子派孫）；子雲祖派下詳註（接九頁一至五）"},
  {id:"ziyun_2", gen:25, name:"孝順", l1:"二房・字世訓", l2:"1896生・書名開正", parent:"ziyun",
   note:"子雲公二房。名孝順，書名開正，字世訓。生於光緒二十二年丙申四月初九日戌時，即一八九六年五月廿一日（星期四）。卒年原文空白。\n妻郭氏：名粉樓，號慈桂。生於光緒廿三年丁酉九月十三日子時，即一八九七年十月八日（星期五）。娘家南陽鄉。\n生二子三女：長女喜花，適南陽坑仔新鄉；次女蘭花，適後望鄉；三女自小給軍寮。", src:"世系第五圖；世系圖（平章祖第四子派孫）；子雲祖派下詳註（接九頁一至五）"},
  {id:"ziyun_3", gen:25, name:"孝猛", l1:"三房・號璧洲", l2:"1906–1957・葬邦咯島", parent:"ziyun",

  {id:"zibin_1", gen:25, name:"執淑", l1:"長房・號璧勳", l2:"1892生・字世享", parent:"zibin",
   note:"子彬公長房。名執淑，書名開貞，字世享（世系圖作世亨，待核），號璧勳。生於光緒十八年壬辰七月初七日，即一八九二年八月廿八日（星期日）。卒年原文空白。生五子。\n妣（第一位）：名原文空白，號慈善（待核）。生於光緒十八年壬辰二月初二日申時，即一八九二年二月廿九日（星期一）。終於民國元年壬子二月十九日寅時，即一九一二年四月六日（星期六）。享壽二十一。葬浮山。\n妣郭氏（第二位）：號慈金。生卒原文空白。娘家在南陽鄉。\n兩位妻子與五子如何對應，原文未寫明。", src:"世系第五圖；世系第七圖（平章祖第五子派孫）；子彬祖派下詳註（接九頁二）"},

  "八世桂峯公有三位祖妣：郭氏生長房樵隱公，側室李氏生二房松軒公，洪氏生三房梅圃公。",
  "十四世養泉公有五位祖妣，十子分屬王、黃、曾、李四位所生；六峯公為黃氏所生。",
  "八世桂峯公開枝，分出三房：長房九世樵隱公、二房九世松軒公、三房九世梅圃公。",
  "十世澄江公、十世平原公兩房，歷代派孫稀微。",
  "十一世東園公、靖素公、德恭公三房，明代遷居惠州府海豐縣（序文作東莞）。",
  "十二世東石公（東園公之子）中進士，任北京户科給事中，俗稱陳北科。",
  "十一世恬守公之長至五房（十二世），無從查考。",
  "十四世養泉公任平和縣縣令，生十子。長房十五世龍峯公為萬曆癸酉科舉人。",
  "養泉公三、四房（十五世）遷居福建（序文作二至四房）；五至八房派孫住本鄉。",
  "十五世七峯公有兩房遷居潮安、潮陽縣城。",
  "十九世明玉公一支俗稱後厝派；十九世德斋公一支俗稱前厝派。",
  "廿三世平章公生七子，其中六房後人多遷來馬來亞。平章公以下各房並列，不再區分直系。",
  "廿四世平章公七子：名以「文」、字以「光」、書名以「德」排行。",
  "九世松軒公一派遷居金甌鄉；另有派孫遷居東山及澄海冠隴鄉。",
  "序文說在馬來亞，松軒公派多住爪夷（Jawi，在檳城州）。",
  "明末清初，族人多漂泊暹羅、安南，馬來亞次之。",
  "在馬來亞，九世三房皆有後人：梅圃公派孫頗多，樵隱公派孫較少，松軒公派亦在此。",
  "其他各房廿五世以後，詳見族譜後段，待轉錄。"
];

const CN = ["","一","二","三","四","五","六","七","八","九","十"];
function genName(g){ if(g<=10) return CN[g]+"世"; if(g<20) return "十"+CN[g-10]+"世"; if(g===20) return "二十世";
  if(g<30) return "廿"+CN[g-20]+"世"; if(g===30) return "三十世"; return g+"世"; }

const byId = new Map(DATA.map(d => [d.id, {...d, kids: []}]));
byId.forEach(d => { if (d.parent && byId.has(d.parent)) byId.get(d.parent).kids.push(d); });
const roots = [...byId.values()].filter(d => !d.parent || !byId.has(d.parent));
const fakeRoot = {id:"__root", kids: roots};
document.getElementById("total").textContent = DATA.length;

let collapsed = new Set();
try { const s = JSON.parse(localStorage.getItem("hm-collapsed") || "[]"); collapsed = new Set(s.filter(id => byId.has(id))); } catch(e) {}
const saveCollapsed = () => { try { localStorage.setItem("hm-collapsed", JSON.stringify([...collapsed])); } catch(e) {} };
let selected = null, query = "", scale = 1;
/* 精簡旁支：同一父親子嗣超過 FOLD_MIN 人時，只顯示直系一人，其餘兄弟收成一個「另 N 位」 */
const FOLD_MIN = 4;
let compact = true, openFams = new Set();
try { const c = JSON.parse(localStorage.getItem("hm-compact") || "null");
  if (c) { compact = c.on !== false; openFams = new Set((c.open || []).filter(id => byId.has(id))); } } catch(e) {}
const saveCompact = () => { try { localStorage.setItem("hm-compact", JSON.stringify({on: compact, open: [...openFams]})); } catch(e) {} };
const foldable = d => d.kids.length >= FOLD_MIN && d.kids.some(k => k.direct);
function visibleKids(d) {
  if (!d.kids.length) return null;
  if (!compact || !foldable(d)) return d.kids;
  const hidden = d.kids.filter(k => !k.direct);
  if (openFams.has(d.id)) return [...d.kids, {id: "fold-" + d.id, stub: "fold", gen: d.kids[0].gen, fam: d.id, count: hidden.length, sis: hidden.some(k => k.female)}];
  return [...d.kids.filter(k => k.direct), {id: "stub-" + d.id, stub: "open", gen: d.kids[0].gen, fam: d.id, count: hidden.length,
    names: hidden.map(k => k.name), sis: hidden.some(k => k.female)}];
}
/* 讓某人可見：展開祖先，並打開他所在的兄弟組 */
function reveal(id) {
  let q = byId.get(id);
  while (q && q.parent) { collapsed.delete(q.parent); if (!q.direct) openFams.add(q.parent); q = byId.get(q.parent); }
  saveCollapsed(); saveCompact();
}

const SLOT = 170, ROW = 100, GAPROW = 60, LEFT = 86, TOP = 40, BW = 28, BH = 22;
const canvas = document.getElementById("canvas");
const ns = "http://www.w3.org/2000/svg";
const el = (tag, attrs = {}, parent) => { const e = document.createElementNS(ns, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const countDesc = d => d.kids.reduce((n, k) => n + 1 + countDesc(k), 0);
const matches = d => query && (d.name + d.l1 + d.l2 + (d.note || "")).includes(query);

function draw() {
  const h = d3.hierarchy(fakeRoot, d => d.id === "__root" ? d.kids : (d.stub || collapsed.has(d.id)) ? null : visibleKids(d));
  d3.tree().nodeSize([SLOT, 1]).separation(() => 1)(h);
  const nodes = h.descendants().filter(n => n.data.id !== "__root");
  const gens = [...new Set(nodes.map(n => n.data.gen))].sort((a, b) => a - b);
  const gy = new Map(); let y = TOP + 20;
  gens.forEach((g, i) => { if (i) y += (g - gens[i-1] > 1) ? ROW + GAPROW : ROW; gy.set(g, y); });
  const minX = d3.min(nodes, n => n.x), maxX = d3.max(nodes, n => n.x);
  const ox = LEFT + 30 - minX;
  const W = maxX - minX + LEFT + 30 + 150, H = y + 70;
  const X = n => n.x + ox, Y = n => gy.get(n.data.gen);

  const svg = el("svg", {viewBox: `0 0 ${W} ${H}`, width: W * scale, height: H * scale,
    role: "img", "aria-label": "華美鄉陳氏世系圖"});
  svg.dataset.w = W; svg.dataset.h = H;
  gens.forEach(g => el("line", {class: "genline", x1: 0, x2: W, y1: gy.get(g) - 44, y2: gy.get(g) - 44}, svg));

  const cg = el("g", {}, svg), dg = el("g", {}, svg);
  nodes.forEach(p => {
    if (!p.children) return;
    const px = X(p), py0 = Y(p) + BH / 2;
    const groups = p.children;
    const gc = groups[0].data.gen, gp = p.data.gen;
    if (gc - gp > 1) {
      groups.forEach(c => {
        el("path", {class: "gap", d: `M${px} ${py0}V${Y(c) - BH/2}`}, cg);
        el("text", {class: "gapnote", x: px + 14, y: (py0 + Y(c)) / 2}, cg).textContent =
          `二至${genName(gc - 1)}：資料待補`;
      });
      return;
    }
    const bus = Y(groups[0]) - BH / 2 - 22;
    const xs = groups.map(X);
    el("path", {class: "conn", d: `M${px} ${py0 + 14}V${bus}M${Math.min(px, ...xs)} ${bus}H${Math.max(px, ...xs)}` +
      xs.map(x => `M${x} ${bus}V${Y(groups[0]) - BH/2}`).join("")}, cg);
    groups.forEach(c => { if (p.data.direct && c.data.direct)
      el("path", {class: "conn direct", d: `M${px} ${py0}V${bus}H${X(c)}V${Y(c) - BH/2}`}, dg); });
  });

  nodes.forEach(n => {
    const d = n.data, x = X(n), yy = Y(n);
    if (d.stub) {
      const open = d.stub === "open";
      const fam = byId.get(d.fam);
      const t = el("g", {class: "stub", role: "button", tabindex: 0,
        "aria-label": open ? `顯示${fam.name}其餘 ${d.count} 位子女` : `收起${fam.name}其餘 ${d.count} 位子女`}, svg);
      el("rect", {x: x - BW/2, y: yy - 15, width: 132, height: open ? 44 : 30, rx: 8}, t);
      el("text", {x: x - BW/2 + 12, y: yy + 5}, t).textContent = open ? `＋ 另 ${d.count} 位${d.sis ? "兄弟姊妹" : "兄弟"}` : `－ 收起 ${d.count} 位${d.sis ? "兄弟姊妹" : "兄弟"}`;
      if (open) el("text", {class: "sub2", x: x - BW/2 + 12, y: yy + 22}, t).textContent =
        d.names.slice(0, 3).join("、") + (d.names.length > 3 ? "…" : "");
      const act = () => { open ? openFams.add(d.fam) : openFams.delete(d.fam); saveCompact(); draw(); };
      t.addEventListener("click", act);
      t.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); act(); } });
      return;
    }
    const cls = ["node", d.direct ? "direct" : "branch", d.unsure ? "unsure" : ""].join(" ");
    const g = el("g", {class: cls, tabindex: 0, role: "button", "aria-label": `${genName(d.gen)} ${d.name}`}, svg);
    if (matches(d)) el("rect", {class: "hl", x: x + BW/2 + 6, y: yy - 16, width: d.name.length * 15 + 10, height: 22, rx: 3}, g);
    if (selected === d.id) el("rect", {class: "sel", x: x - BW/2 - 6, y: yy - BH/2 - 6, width: 140, height: BH + 34, rx: 6}, g);
    el("rect", {class: "blk", x: x - BW/2, y: yy - BH/2, width: BW, height: BH, rx: 4}, g);
    el("text", {class: "nm", x: x + BW/2 + 10, y: yy + 0}, g).textContent = d.name;
    if (d.l1) el("text", {class: "dt", x: x + BW/2 + 10, y: yy + 17}, g).textContent = d.l1;
    if (d.l2) el("text", {class: "dt", x: x + BW/2 + 10, y: yy + 32}, g).textContent = d.l2;
    const pick = () => { selected = d.id; draw(); showPerson(d.id); };
    g.addEventListener("click", pick);
    g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } });
    if (d.kids.length) {
      const t = el("g", {class: "tg", role: "button", tabindex: 0,
        "aria-label": collapsed.has(d.id) ? `展開 ${d.name}` : `收起 ${d.name}`}, svg);
      el("circle", {cx: x, cy: yy + BH/2 + 13, r: 8}, t);
      el("text", {x: x, y: yy + BH/2 + 17.5, "text-anchor": "middle"}, t).textContent = collapsed.has(d.id) ? "+" : "−";
      if (collapsed.has(d.id)) el("text", {class: "n", x: x - 12, y: yy + BH/2 + 17, "text-anchor": "end"}, t)
        .textContent = `${countDesc(d)} 人`;
      const flip = e => { e.stopPropagation(); collapsed.has(d.id) ? collapsed.delete(d.id) : collapsed.add(d.id); saveCollapsed(); draw(); };
      t.addEventListener("click", flip);
      t.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); flip(e); } });
    }
  });
  // 世代標籤：固定在左邊，橫向捲動時跟着移動
  const genG = el("g", {class: "gencol"}, svg);
  el("rect", {class: "genbg", x: 0, y: 0, width: 62, height: H}, genG);
  gens.forEach(g => { el("text", {class: "gen", x: 10, y: gy.get(g) + 4}, genG).textContent = genName(g); });
  const pin = () => genG.setAttribute("transform", `translate(${canvas.scrollLeft / scale},0)`);
  canvas.onscroll = pin;
  canvas.replaceChildren(svg); pin();
  document.getElementById("zlab").textContent = Math.round(scale * 100) + "%";
}

function link(id) { const d = byId.get(id); return `<a data-id="${id}">${d.name}</a>`; }
function showPerson(id) {
  const d = byId.get(id), p = d.parent && byId.get(d.parent);
  // 平章公（廿三世）以下各房並列，不標直系或旁支
  const kind = d.gen > 23 ? "" : (d.direct ? "本支直系" : "旁支");
  const panel = document.getElementById("panel");
  panel.hidden = false;
  panel.innerHTML = `
    <button class="close" id="home" aria-label="關閉">×</button>
    <h2>${d.name}</h2>
    <p class="meta">${[genName(d.gen), kind, d.unsure ? "無從查考" : ""].filter(Boolean).join(" · ")}</p>
    ${[d.l1, d.l2].filter(Boolean).length ? `<p>${[d.l1, d.l2].filter(Boolean).join("・")}</p>` : ""}
    ${d.note ? `<h3>記載</h3><p>${d.note.replace(/【\/?私】/g, "").replace(/\n/g, "<br>")}</p>` : ""}
    ${p ? `<h3>父親</h3><p>${link(p.id)}</p>` : ""}
    ${d.kids.length ? `<h3>子女（${d.kids.length}）</h3><ul>${d.kids.map(k => `<li>${link(k.id)}　<span class="meta">${k.l1 || ""}</span></li>`).join("")}</ul>` : ""}
    ${d.src ? `<h3>出處</h3><p class="meta">${d.src}</p>` : ""}`;
}
function showHome() {
  const line = DATA.filter(d => d.direct).sort((a, b) => a.gen - b.gen);
  document.getElementById("overview").innerHTML = `
    <div><h2>本支直系</h2>
    <p class="meta">點擊圖中任何人，可看記載與出處。</p>
    <ol>${line.map(d => `<li>${genName(d.gen)}　${link(d.id)}</li>`).join("")}</ol></div>
    <div><h2>要點</h2>
    <ul>${NOTES.map(n => `<li>${n}</li>`).join("")}</ul></div>`;
}
function onLink(e) {
  if (e.target.closest("#home")) { selected = null; document.getElementById("panel").hidden = true; draw(); return; }
  const a = e.target.closest("a"); if (!a) return;
  const id = a.dataset.id; if (!id) return;
  reveal(id);
  selected = id; draw(); showPerson(id); scrollTo(id);
}
document.getElementById("panel").addEventListener("click", onLink);
document.getElementById("overview").addEventListener("click", onLink);
document.addEventListener("keydown", e => { if (e.key === "Escape" && !document.getElementById("panel").hidden) onLink({target: document.getElementById("home")}); });

function scrollTo(id) {
  requestAnimationFrame(() => {
    const g = [...canvas.querySelectorAll(".node")].find(n => n.getAttribute("aria-label").endsWith(" " + byId.get(id).name));
    if (!g) return;
    const r = g.getBoundingClientRect(), c = canvas.getBoundingClientRect();
    canvas.scrollLeft += r.left - c.left - c.width / 2 + 60;
    canvas.scrollTop += r.top - c.top - c.height / 2;
  });
}

const setScale = s => { scale = Math.max(0.3, Math.min(2.5, s)); draw(); };
document.getElementById("zin").onclick = () => setScale(scale * 1.2);
document.getElementById("zout").onclick = () => setScale(scale / 1.2);
document.getElementById("fit").onclick = () => { draw(); const svg = canvas.querySelector("svg");
  setScale(Math.min(1.2, (canvas.clientWidth - 4) / +svg.dataset.w)); };
function setCompact(on) {
  compact = on; if (on) openFams.clear();
  const b = document.getElementById("compact");
  b.setAttribute("aria-pressed", on ? "true" : "false"); b.textContent = on ? "精簡旁支：開" : "精簡旁支：關";
  saveCompact();
}
document.getElementById("compact").onclick = () => { setCompact(!compact); draw(); };
document.getElementById("openall").onclick = () => { collapsed.clear(); saveCollapsed(); setCompact(false); draw(); };
document.getElementById("direct").onclick = () => {
  collapsed = new Set(); DATA.forEach(d => { if (!d.direct && byId.get(d.id).kids.length) collapsed.add(d.id); });
  // 收起旁支人物的後代，並把旁支兄弟收成「另 N 位」
  saveCollapsed(); setCompact(true); draw(); };
document.getElementById("q").addEventListener("input", e => {
  query = e.target.value.trim();
  const hits = query ? DATA.filter(matches) : [];
  hits.forEach(h => reveal(h.id));
  document.getElementById("hits").textContent = query ? `找到 ${hits.length} 人` : "";
  draw(); if (hits.length) scrollTo(hits[0].id);
});

/* ===== 背景顏色 ===== */
const rootEl = document.documentElement, hostTheme = rootEl.getAttribute("data-theme");
const isDark = hex => { const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  return (0.2126 * r + 0.7152 * g + 0.0722 * b) < 128; };
function applyBg(v, custom) {
  rootEl.style.removeProperty("--bg");
  const pick = document.getElementById("bgpick");
  pick.hidden = v !== "custom";
  if (v === "system") { hostTheme ? rootEl.setAttribute("data-theme", hostTheme) : rootEl.removeAttribute("data-theme"); }
  else if (v === "dark") { rootEl.setAttribute("data-theme", "dark"); }
  else {
    const hex = v === "custom" ? (custom || pick.value) : v;
    rootEl.setAttribute("data-theme", isDark(hex) ? "dark" : "light");
    rootEl.style.setProperty("--bg", hex);
    if (v === "custom") pick.value = hex;
  }
  try { localStorage.setItem("hm-bg", JSON.stringify({v, c: document.getElementById("bgpick").value})); } catch(e) {}
}
document.getElementById("bgsel").addEventListener("change", e => applyBg(e.target.value));
document.getElementById("bgpick").addEventListener("input", e => applyBg("custom", e.target.value));
try { const b = JSON.parse(localStorage.getItem("hm-bg") || "null");
  if (b && b.v) { document.getElementById("bgsel").value = b.v; if (b.c) document.getElementById("bgpick").value = b.c; applyBg(b.v, b.c); } } catch(e) {}

{ const b = document.getElementById("compact");
  b.setAttribute("aria-pressed", compact ? "true" : "false"); b.textContent = compact ? "精簡旁支：開" : "精簡旁支：關"; }
draw(); showHome();
requestAnimationFrame(() => { const svg = canvas.querySelector("svg");
  const fit = (canvas.clientWidth - 4) / +svg.dataset.w; if (fit < 1) setScale(Math.max(0.6, fit));
  canvas.style.scrollBehavior = 'auto'; scrollTo('tongzhi'); requestAnimationFrame(() => { canvas.style.scrollBehavior = ''; }); });
</script>
<script>
/* 只看某支：選一位祖先，圖只畫他和他的後代。
   依賴主程式的 byId、fakeRoot、roots、draw、showPerson、collapsed、countDesc、genName。
   由 build.py 放在主程式之後。 */
(function () {
  let focus = null;
  const bar = document.querySelector(".bar");
  const panel = document.getElementById("panel");

  const st = document.createElement("style");
  st.textContent = `
.focusbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 0 0 10px; padding: 8px 12px;
  border: 1px solid var(--fg); border-radius: 8px; font-size: 14px; }
.focusbar[hidden] { display: none; }
.focusbar span { flex: 1 1 auto; }
.focusbar button, .panel .focusbtn { font: inherit; font-size: 14px; padding: 5px 12px; border: 1px solid var(--rule);
  border-radius: 6px; background: var(--bg); color: var(--fg); cursor: pointer; }
.focusbar button:hover, .panel .focusbtn:hover { border-color: var(--fg); }
.focusbar button:focus-visible, .panel .focusbtn:focus-visible { outline: 2px solid var(--direct); outline-offset: 1px; }
.panel .focusbtn { margin: 6px 0 4px; }
.bar #focus { max-width: 240px; }`;
  document.head.appendChild(st);

  // 某人是否在 root 的後代之中（含 root 本人）
  const inSub = (id, root) => {
    for (let q = byId.get(id); q; q = q.parent && byId.get(q.parent)) if (q.id === root) return true;
    return false;
  };
  const optLabel = d => `${genName(d.gen)}　${d.name}（${d.kids.length} 位子女）`;

  // 工具列：下拉選單
  const lab = document.createElement("label");
  lab.htmlFor = "focus"; lab.textContent = "只看某支";
  const sel = document.createElement("select");
  sel.id = "focus"; sel.setAttribute("aria-label", "只看某支");
  sel.add(new Option("全部（不限）", ""));
  [...byId.values()].filter(d => d.kids.length >= 2).sort((a, b) => a.gen - b.gen)
    .forEach(d => sel.add(new Option(optLabel(d), d.id)));
  document.getElementById("direct").after(lab, sel);
  sel.addEventListener("change", () => setFocus(sel.value));

  // 提示條
  const fb = document.createElement("div");
  fb.className = "focusbar"; fb.hidden = true;
  document.querySelector(".main").before(fb);
  fb.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    setFocus(b.dataset.act === "up" ? byId.get(focus).parent : null);
  });

  function sync() {
    if (focus && ![...sel.options].some(o => o.value === focus)) sel.add(new Option(optLabel(byId.get(focus)), focus));
    sel.value = focus || "";
    if (!focus) { fb.hidden = true; return; }
    const d = byId.get(focus), p = d.parent && byId.get(d.parent);
    fb.hidden = false;
    fb.innerHTML = `<span>目前只顯示：<b>${genName(d.gen)} ${d.name}</b> 及其後代（共 ${countDesc(d) + 1} 人）</span>` +
      (p ? `<button data-act="up">↑ 上一層：${p.name}</button>` : "") +
      `<button data-act="all">顯示全部</button>`;
  }

  function setFocus(id) {
    focus = id || null;
    if (focus) { collapsed.delete(focus); saveCollapsed(); }
    draw();
    document.getElementById("fit").click();   // 縮放到適合畫面
    canvas.style.scrollBehavior = "auto";   // 直接跳到位，不用慢慢捲動
    if (focus) scrollTo(focus); else { canvas.scrollLeft = 0; canvas.scrollTop = 0; }
    requestAnimationFrame(() => requestAnimationFrame(() => { canvas.style.scrollBehavior = ""; }));
  }

  // 換掉 draw：畫之前先決定根
  const baseDraw = draw;
  draw = function () {
    fakeRoot.kids = focus ? [byId.get(focus)] : roots;
    baseDraw();
    sync();
  };

  // 人物面板：加「只看此支」按鈕
  const baseShow = showPerson;
  showPerson = function (id) {
    baseShow(id);
    const d = byId.get(id);
    if (!d.kids.length || id === focus) return;
    const b = document.createElement("button");
    b.className = "focusbtn"; b.textContent = "只看此支";
    b.addEventListener("click", () => setFocus(id));
    panel.querySelector(".meta").after(b);
  };

  // 點到本支以外的人（例如父親連結）：先取消只看某支
  const guard = e => {
    const a = e.target.closest("a[data-id]");
    if (a && focus && byId.has(a.dataset.id) && !inSub(a.dataset.id, focus)) focus = null;
  };
  panel.addEventListener("click", guard, true);
  document.getElementById("overview").addEventListener("click", guard, true);

  // 搜尋：只算本支內的人
  document.getElementById("q").addEventListener("input", () => {
    if (!focus || !query) return;
    const n = DATA.filter(d => matches(d) && inSub(d.id, focus)).length;
    document.getElementById("hits").textContent = `本支內找到 ${n} 人`;
  });

  sync();
})();
</script>
